<!DOCTYPE html>
<html>
<head>
    <title>ExoHabitAI</title>
    <link rel="stylesheet"
     href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">

<div class="container mt-5">
    <h2 class="text-center">Exoplanet Habitability Predictor 🌍</h2>

    <div class="card p-4 mt-4">
        <input class="form-control mb-2" id="radius" placeholder="Planet Radius (Earth units)">
        <input class="form-control mb-2" id="mass" placeholder="Planet Mass (Earth units)">
        <input class="form-control mb-2" id="period" placeholder="Orbital Period (days)">
        <input class="form-control mb-2" id="temp" placeholder="Equilibrium Temperature (K)">
        <input class="form-control mb-2" id="stellar" placeholder="Stellar Temperature (K)">

        <button class="btn btn-primary mt-3" onclick="predict()">Predict</button>

        <h4 class="mt-3" id="result"></h4>
    </div>
</div>

<script>
function predict() {
    fetch('/predict', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
            planet_radius: document.getElementById('radius').value,
            planet_mass: document.getElementById('mass').value,
            orbital_period: document.getElementById('period').value,
            equilibrium_temp: document.getElementById('temp').value,
            stellar_temp: document.getElementById('stellar').value
        })
    })
    .then(res => res.json())
    .then(data => {
        document.getElementById('result').innerHTML =
            `🪐 ${data.habitability} <br> Confidence: ${data.confidence}%`;
    });
}
</script>

</body>
</html>
